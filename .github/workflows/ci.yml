# Purpose: build the generator + Spring Boot backend, run unit tests, then run the Playwright
# end-to-end suite against the generated UI (12,000 instruments / 15,000 trades) and keep the
# reports as workflow artifacts for ONE day so they can be reviewed from the Actions run page.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gradle build (generate code, compile, unit tests)
        run: gradle build

      - name: Generate frontend sources from schemas
        run: gradle :backend:generateCode

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (starts backend + frontend itself)
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 1

      - name: Upload Playwright raw results (junit, json, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 1

      - name: Upload Gradle test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: |
            generator/build/reports/tests/
            backend/build/reports/tests/
            generator/build/test-results/
            backend/build/test-results/
          retention-days: 1
